<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açaí Prime - Gestão do Dia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo-area">
                <div class="logo-upload" id="logoUpload" style="background: linear-gradient(135deg, #7B1FA2 0%, #9C27B0 100%); display:flex; align-items:center; justify-content:center; border: 2px solid rgba(123,31,162,0.25);">
                    <i class="fas fa-ice-cream" style="font-size: 38px; color: white;"></i>
                    <img id="companyLogo" src="assets/logo.jpg" alt="Açaí Prime Logo" style="display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:20px;" onerror="this.style.display='none'">
                    <div class="logo-edit-overlay">
                        <i class="fas fa-camera"></i>
                    </div>
                    <input type="file" id="logoInput" accept="image/*" hidden>
                </div>
                <h2 class="brand-name" style="color:#CE93D8; letter-spacing: 3px;">AÇAÍ PRIME</h2>
                <p style="font-size:10px; color:#8A8D9B; letter-spacing:2px; margin-top:4px; font-weight:600;">AÇAÍTERIA PREMIUM</p>
            </div>
            
            <nav class="nav-menu">
                <a href="index.html" class="nav-item" data-module="dashboard">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="clientes.html" class="nav-item" data-module="clientes">
                    <i class="fas fa-users"></i>
                    <span>Clientes</span>
                </a>
                <a href="produtos.html" class="nav-item" data-module="produtos">
                    <i class="fas fa-ice-cream"></i>
                    <span>Produtos</span>
                </a>
                <a href="pedidos.html" class="nav-item" data-module="pedidos">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Pedidos</span>
                </a>
                <a href="whatsapp.html" class="nav-item" data-module="whatsapp">
                    <i class="fab fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </a>
                <a href="ia-atendente.html" class="nav-item" data-module="ia">
                    <i class="fas fa-robot"></i>
                    <span>IA Atendente</span>
                </a>
                <a href="gestao-do-dia.html" class="nav-item active" data-module="gestao-dia">
                    <i class="fas fa-calendar-day"></i>
                    <span>Gestão do Dia</span>
                </a>
                <a href="relatorios.html" class="nav-item" data-module="relatorios">
                    <i class="fas fa-chart-bar"></i>
                    <span>Relatórios</span>
                </a>
                <a href="configuracoes.html" class="nav-item" data-module="configuracoes">
                    <i class="fas fa-cog"></i>
                    <span>Configurações</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="cardapio.html" target="_blank" class="btn-cardapio">
                    <i class="fas fa-external-link-alt"></i>
                    <span>Abrir Cardápio</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-title">
                    <h1 id="pageTitle">Gestão do Dia</h1>
                </div>
                <div class="header-actions">
                    <div class="status-indicator" id="whatsappStatus">
                        <i class="fab fa-whatsapp"></i>
                        <span>Desconectado</span>
                    </div>
                    <!-- Notificações -->
                    <div style="position:relative;">
                        <button id="notificationBell" class="notification-bell-btn" onclick="toggleNotifications()" title="Notificações">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge" id="notificationBadge" style="display:none;">0</span>
                        </button>
                        <div id="notificationPanel" class="notification-panel"></div>
                    </div>
                    <!-- Banco de Imagens -->
                    <button class="btn-icon-header" onclick="openBankManager()" title="Banco de Imagens">
                        <i class="fas fa-images"></i>
                    </button>
                    <!-- Editor de Conteúdo -->
                    <button id="editModeToggleBtn" class="btn-icon-header" onclick="toggleEditMode()" title="Ativar modo de edição">
                        <i class="fas fa-edit"></i>
                    </button>
                    <div class="user-menu">
                        <div class="user-avatar">AP</div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Gestão do Dia Module -->
                <div class="module" id="module-gestao-dia">
                    <!-- Renderizado dinamicamente por daily-tools.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Gestão do Dia</h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo do modal -->
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="image-manager.js"></script>
    <script src="notifications.js"></script>
    <script src="grok-service.js"></script>
    <script src="daily-tools.js"></script>
    <script src="html-editor.js"></script>
    <script src="brain.js"></script>
    <script src="shipping-rates.js"></script>
    <script src="app.js"></script>
    <script>
        // Inicializar Gestão do Dia
        document.addEventListener('DOMContentLoaded', () => {
            if (window.renderDailyToolsModule) {
                window.renderDailyToolsModule();
            }
        });
    </script>
    <script src="session-check.js"></script>
</body>
</html>
